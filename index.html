<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wingit Partner">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318181a'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<title>Wingit Partner</title>
<meta name="description" content="Clickable Wingit Club partner app">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e7e3;--app:#f6f5f2;--surface:#ffffff;--ink:#18181a;--ink2:#3c3c40;--muted:#77767c;--faint:#a3a2a8;
  --line:#e6e5e0;--line2:#efeee9;--chip:#efeee9;
  --ok:#2c7a4b;--okbg:#e6f2ea;--warn:#93590a;--warnbg:#fbf0dc;--bad:#b42318;--badbg:#fcebe9;
  --r:16px;--shadow:0 1px 2px rgba(20,20,20,.04),0 2px 8px rgba(20,20,20,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 12px;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}
svg.i.l{width:24px;height:24px}

/* Device frame (desktop) / full screen (phone) */
.stage{position:relative;flex:0 0 auto}
.phone{width:410px;height:864px;transform-origin:top left;position:absolute;left:0;top:0;background:var(--app);border:10px solid #18181a;border-radius:48px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.2)}
.outside{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px}
.outside button{border:1px solid #cbcac4;border-radius:999px;padding:6px 12px;background:#fff;font-size:12px;font-weight:500}
.outside b{color:var(--ink2)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width:520px), (hover:none) and (pointer:coarse){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{padding:0;justify-content:flex-start;align-items:stretch;gap:0;background:var(--surface)}
  .stage{width:100%!important;height:100%!important;max-width:560px;margin:0 auto}
  .phone{position:static;width:100%;height:100%;border:0;border-radius:0;box-shadow:none;transform:none!important}
  .outside,.statusbar{display:none!important}
  #app{padding-top:env(safe-area-inset-top);background:var(--app)}
  .hometop,.pagetitle,.topbar{box-shadow:0 calc(-1 * env(safe-area-inset-top)) 0 var(--surface)}
  .foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .content{padding-left:14px;padding-right:14px}
  input,select,textarea{font-size:16px!important}
  .sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media (max-width:360px){
  .stat .v{font-size:16px}
  .seg button{font-size:12px;padding:8px 4px}
  .timer .count{font-size:24px!important}
}
#app{display:flex;flex-direction:column;height:100%;position:relative}
.statusbar{height:36px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0;font-size:13px;font-weight:600;background:var(--surface)}
.statusbar .sig{display:flex;gap:5px;align-items:center}
.statusbar .bat{width:22px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative}
.statusbar .bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:var(--ink);border-radius:1px}

/* Top bars */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .tt{flex:1;min-width:0}
.topbar .title{font-weight:600;font-size:17px;letter-spacing:-.01em}
.topbar .sub{font-size:12px;color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--app);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stepno{font-size:11px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:999px;padding:4px 9px;white-space:nowrap}
.hometop{flex:0 0 auto;background:var(--surface);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.hometop .date{font-size:12px;color:var(--muted)}
.hometop .hello{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.avatar.sm{width:34px;height:34px;font-size:12.5px}
.avatar.homeav{margin-left:0;width:38px;height:38px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;margin-left:auto;flex:0 0 auto}
.avatar.xl{width:72px;height:72px;font-size:24px;margin:0}
.pagetitle{flex:0 0 auto;background:var(--surface);padding:14px 18px;border-bottom:1px solid var(--line)}
.pagetitle h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.pagetitle p{font-size:12px;color:var(--muted)}
.progress{height:3px;background:var(--line);flex:0 0 auto}
.progress i{display:block;height:100%;background:var(--ink);transition:width .35s ease}

/* Layout */
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.content>*{flex-shrink:0}
.foot{flex:0 0 auto;padding:12px 16px 18px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px}
.foot>.btn{flex:1}
.sec{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.sec h2{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sec .count{font-size:11px;font-weight:600;background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tap{cursor:pointer;transition:transform .1s}
.card.tap:active{transform:scale(.99)}
.card.dashed{background:transparent;border-style:dashed;box-shadow:none}
.ct{font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.b{font-weight:600}
.small{font-size:12.5px}
.xs{font-size:11.5px}
.muted{color:var(--muted)}
.mt{margin-top:10px}
.mt4{margin-top:4px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line2)}
.kv:first-child{padding-top:0}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv>span{color:var(--muted);flex:0 0 auto}
.kv>b{text-align:right;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;font-weight:500;background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--ink2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.dark{background:var(--ink);color:#fff}

/* Buttons */
.btn{background:var(--ink);color:#fff;border-radius:14px;padding:14px;font-weight:600;font-size:14.5px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:opacity .15s}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid #d6d5cf}
.btn.sm{padding:10px 12px;font-size:13.5px;border-radius:12px}
.btn.okb{background:var(--ok)}
.btn.badb{background:var(--surface);color:var(--bad);border:1px solid #efc3bd}
.btn.full{width:100%}
.btn[disabled],.btn.disabled{opacity:.32;pointer-events:none}
.link{color:var(--ink);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Segmented controls */
.seg{display:flex;background:#e9e8e3;border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:600;font-size:13px;color:#56555b;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.sm button{padding:7px 4px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.dot.on{background:#2fa35f}.dot.lunch{background:#d88a0b}.dot.off{background:#9a99a0}

.banner{border-radius:12px;padding:11px 13px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.muted{background:#e9e8e3;color:#4e4d53}
.banner.bad{background:var(--badbg);color:var(--bad)}

/* Hero timer */
.timer{background:var(--ink);color:#fff;border:0;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.timer .label{font-size:11.5px;opacity:.65;white-space:nowrap}
.timer .count{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15}
.timer .meta{margin-left:auto;text-align:right;font-size:11.5px;line-height:1.5;opacity:.85;white-space:nowrap}
.timer .meta b{font-weight:600;opacity:1}
.upc{background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.upc .label{font-size:12px;color:rgba(255,255,255,.72);font-weight:600;text-transform:none;letter-spacing:0}
.upc .count{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.upc .dim{color:rgba(255,255,255,.72)}
.upc .tag.rep{background:#DCFCE7;color:#15803D;vertical-align:middle;font-size:10.5px;padding:2px 7px}
.upcst{font-size:12px;font-weight:700}.upcst.ok{color:#86EFAC}.upcst.pend{color:#FCA5A5}
.upcgo{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.upcline{font-size:13px;color:rgba(255,255,255,.8);border-top:1px solid rgba(255,255,255,.12);padding-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upcline b{color:#fff}
.hero{border:1.5px solid var(--ink)}

/* Product tile */
.thumb{width:46px;height:46px;border-radius:12px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#2e2e31;letter-spacing:.02em}
.thumb small{font-size:7.5px;font-weight:600;opacity:.65;text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.thumb.lg{width:60px;height:60px;font-size:16px;border-radius:14px}
.prow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.prow:first-of-type{padding-top:2px}
.prow:last-child{border-bottom:0;padding-bottom:0}
.chk{width:26px;height:26px;border-radius:8px;border:1.5px solid #c3c2bc;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff;color:#fff}
.chk.on{background:var(--ink);border-color:var(--ink)}
.chk[disabled]{opacity:.3}
.checkline{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.map{width:100%;height:160px;border:0;border-radius:var(--r);background:#ddd;display:block}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.stepper button{width:34px;height:32px;font-size:18px;background:var(--app)}
.stepper button[disabled]{opacity:.3}
.stepper b{min-width:30px;text-align:center}
.choice{display:flex;gap:14px;text-align:left;padding:18px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);width:100%;box-shadow:var(--shadow);align-items:flex-start}
.choice.dis{opacity:.4;pointer-events:none}
.choice .big{font-size:16px;font-weight:600}
.choice .ico{width:42px;height:42px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.contact{border:1px solid var(--line);border-radius:14px;padding:12px 8px;font-weight:600;font-size:13px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px}
.otp{width:100%;font-size:30px;letter-spacing:.7em;text-indent:.7em;text-align:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-variant-numeric:tabular-nums;outline:none}
.otp:focus,.field:focus{border-color:var(--ink)}
.field{width:100%;border:1px solid #d9d8d2;border-radius:12px;padding:11px 12px;background:#fff;outline:none}
textarea.field{min-height:72px;resize:vertical}
label.fl{font-size:12px;color:var(--muted);display:block;margin:10px 0 5px;font-weight:500}
.total{font-size:18px}
.total>span{color:var(--ink)!important;font-weight:600}
.total>b{font-weight:700!important}
.strike{text-decoration:line-through;color:var(--muted);margin-right:6px}
.qr{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 10px}
.stars{display:flex;gap:8px;justify-content:center}
.stars button{color:#d3d2cc}
.stars button.on{color:#e0a100}
.stars svg{width:34px;height:34px;fill:currentColor;stroke:none}
.ministars{display:inline-flex;gap:1px;color:#e0a100}
.ministars svg{width:13px;height:13px;fill:currentColor}
.ministars .off{color:#d3d2cc}
.center{text-align:center}
.bigicon{width:56px;height:56px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--chip)}
.bigicon.ok{background:var(--okbg);color:var(--ok)}
.bigicon svg{width:28px;height:28px}

/* Slider */
.slider{position:relative;height:58px;border-radius:999px;background:var(--ink);color:#fff;overflow:hidden;width:100%;user-select:none;-webkit-user-select:none}
.slider .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;padding-left:44px;pointer-events:none;opacity:.92}
.slider .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.14)}
.slider .knob{position:absolute;left:5px;top:5px;width:48px;height:48px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;transition:transform .25s}
.slider.disabled{background:#cfcec8}
.slider.disabled .knob{color:#cfcec8;cursor:not-allowed}

/* Sheet & toast */
.overlay{position:absolute;inset:0;background:rgba(10,10,12,.42);display:flex;align-items:flex-end;z-index:20;animation:fade .15s}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:10px 18px 24px;display:flex;flex-direction:column;max-height:85%;overflow-y:auto;animation:up .2s ease}
.grab{width:40px;height:4px;border-radius:2px;background:#d9d8d2;margin:0 auto 14px}
.sheet .btns{margin-top:16px;display:flex;gap:10px}
.sheet .btns .btn{flex:1}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:#fff;padding:13px 14px;border-radius:14px;font-size:13px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:up .2s ease}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Bottom nav */
.livebar{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin:0 10px 8px;padding:10px 12px 13px;border-radius:14px;background:var(--ink);color:#fff;border:0;text-align:left;font:inherit;box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;z-index:3;overflow:hidden}
.livebar b{display:block;font-size:14px;color:#fff;margin-top:1px}.livebar .xs{display:block;color:rgba(255,255,255,.7);font-size:11.5px}
.livelate{color:#FCA5A5;font-weight:700}
.liveic{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.livego{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.liveprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.14)}.liveprog span{display:block;height:100%;background:#fff;border-radius:0 3px 3px 0}
.livebar+.nav{border-top:0}
.nav{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--faint);padding:4px 0;position:relative}
.nav button.on{color:var(--ink);font-weight:600}
.nav .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center}

/* Lists */
.empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 16px;border:1px dashed #d3d2cc;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:8px}
.list-sep{height:1px;background:var(--line2);margin:12px 0}
.exc{padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px}
.exc:last-child{border-bottom:0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat .v{font-size:19px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--muted)}
.daylabel{font-size:12px;font-weight:600;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
.orow{display:flex;gap:12px;align-items:center}
.otime{width:66px;flex:0 0 auto;white-space:nowrap}
.menu{padding:0;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-bottom:1px solid var(--line2);text-align:left;font-weight:500}
.menu button:last-child{border-bottom:0}
.menu .val{margin-left:auto;color:var(--muted);font-size:13px;font-weight:400;display:flex;align-items:center;gap:4px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .st{position:relative;padding:4px 0 10px}
.tl .st:last-child{padding-bottom:0}
.tl .st::before{content:"";position:absolute;left:-21px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
.tl .st.pending::before{background:#d3d2cc}
.mapcard{position:relative;height:132px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#eceee8;
  background-image:linear-gradient(#dfe2da 1px,transparent 1px),linear-gradient(90deg,#dfe2da 1px,transparent 1px),linear-gradient(32deg,transparent 46%,#f8f7f2 46%,#f8f7f2 54%,transparent 54%),linear-gradient(-58deg,transparent 47%,#f8f7f2 47%,#f8f7f2 53%,transparent 53%);
  background-size:22px 22px,22px 22px,100% 100%,100% 100%;display:flex;align-items:flex-end;justify-content:space-between;padding:12px;text-decoration:none;color:var(--ink)}
.mapcard .pinmark{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.mapcard .pinmark i{width:10px;height:10px;border-radius:50%;background:#fff}

const TITLES = {
  details: ['Task details', 'Review'], pickup: ['Go to dark store', 'Step 1 of 7'], qc: ['Check products', 'Step 2 of 7'], travel: ['Travel to customer', 'Step 3 of 7'],
  verify: ['Verify customer', 'Step 4 of 7'], trial: ['Beauty trial', 'Step 5 of 7'], outcome: ['Trial outcome', 'Step 5 of 7'],
  basket: ['Final basket', 'Step 6 of 7'], payment: ['Payment received', 'Step 6 of 7'], close: ['Close session', 'Step 6 of 7'],
  nopurchase: ['Visit feedback', 'Step 6 of 7'], return: ['Return inventory', 'Step 7 of 7']
};
const PROG = { details: 4, pickup: 10, qc: 18, travel: 30, verify: 40, trial: 52, outcome: 58, basket: 66, payment: 74, close: 82, nopurchase: 78, return: 92 };
function stageOf(t) { return RET_STATES.includes(t.status) ? 'return' : (t.p.stage || 'details'); }

/* Step order for the ‹ back button */
const PATH_A = ['details', 'pickup', 'qc', 'travel', 'verify', 'trial', 'outcome', 'basket', 'payment', 'close', 'return'];
const PATH_B = ['details', 'pickup', 'qc', 'travel', 'verify', 'trial', 'outcome', 'nopurchase', 'return'];
const pathOf = t => t.p.outcome === 'B' ? PATH_B : PATH_A;
/* A step is view only once a later slider / OTP / payment has confirmed it */
function isLocked(t, st) {
  const p = t.p, paid = p.pay && p.pay.status === 'paid';
  switch (st) {
    case 'details': return t.status === 'in_progress';
    case 'pickup': return !!p.atStore;
    case 'qc': return !!p.pickedAt;
    case 'travel': case 'verify': return !!p.verifiedAt;
    case 'trial': case 'outcome': return !!p.link || !!paid;
    case 'basket': case 'payment': return !!paid;
    case 'close': return !!t.completedAt;
    default: return false;
  }
}

function taskView(t) {
  const cur = stageOf(t);
  const st = ui.viewStage && ui.viewStage !== cur ? ui.viewStage : cur;
  const ro = st !== cur;
  const V = { details, pickup, qc, travel, verify, trial, outcome, basket, payment, close, nopurchase, return: returnView };
  const out = V[st](t);
  const body = ro ? `<div class="banner view">${ic('shield', 's')}<div><b>Already confirmed</b><br><span class="xs">You can look at this step, but it can't be changed.</span></div></div>${out.body}` : out.body;
  const foot = ro ? `<button class="btn" data-act="resume">Continue to ${TITLES[cur][0].toLowerCase()} ${ic('arrow', 's')}</button>` : out.foot;
  return `
  <header class="topbar"><button class="iconbtn" data-act="back" aria-label="Back">${ic('back')}</button>
    <div class="tt"><div class="title">${st === 'close' && (t.p.photos || {}).handover ? 'Session review' : TITLES[st][0]}</div><div class="sub">${ro ? '<b>View only</b>' : TITLES[st][1]} · ${t.id} · ${esc(t.customer.name.split(' ')[0])}</div></div>
    ${sosBtn(AT_CUSTOMER.includes(st))}</header>
  <div class="progress"><i style="width:${PROG[st]}%"></i></div>
  <main class="content ${ro ? 'ro' : ''}">${body}</main>
  ${foot ? `<footer class="foot">${foot}</footer>` : ''}
  ${navBar()}`;
}

  const canReport = ['tester', 'sealed'].some(pt => (pt === 'tester' ? i.tester : i.sealed) && partSt(t, i.sku, pt) === 'ok');
  return `<div class="prow ${na ? 'na' : ''}">
      ${na ? `<span class="chk" style="opacity:.3"></span>` : `<button class="chk ${ok ? 'on' : ''}" data-act="check" data-id="${m.id}" ${broken.length ? 'disabled' : ''} aria-label="Received">${ok ? ic('check', 's') : ''}</button>`}
      ${thumb(i.sku)}
      <div class="grow"><div class="b small nm">${esc(m.name)}</div><div class="xs muted">${esc(m.sub)}</div>
        <div class="tags">${i.tester ? partTag('tester', 'Tester ×1') : ''}${partTag('sealed', `Sealed ×${i.sealed}`)}${extraTag(i)}</div>
        ${na ? '<div class="xs mt4" style="color:var(--bad)">Not available at pickup</div>' : ''}
      </div>
      ${canReport ? `<button class="link" data-act="qcReport" data-sku="${i.sku}">Report</button>` : ''}
    </div>
    ${broken.map(pt => `<div class="pickbox"><div class="xs"><b>Reported successfully</b> · talk to the picker about the broken ${pt === 'tester' ? 'tester' : 'sealed unit'}</div>
          <div class="row mt" style="gap:8px"><button class="btn sm grow" style="padding:9px" data-act="qcReplaced" data-sku="${i.sku}" data-v="${pt}">${ic('check', 's')} Replacement received</button><button class="btn ghost sm grow" style="padding:9px" data-act="qcNoReplace" data-sku="${i.sku}" data-v="${pt}">No replacement</button></div></div>`).join('')}`;
}
function qc(t) {
  const p = t.p; p.checks = p.checks || {}; p.qc = p.qc || {};
  const list = manifest(t), main = list.filter(m => !m.extra), extras = list.filter(m => m.extra);
  const done = list.filter(m => qcRowDone(t, m)).length;
  const tickable = list.filter(m => !(m.i && fullyNA(t, m.i)));
  const allOn = tickable.length && tickable.every(m => p.checks[m.id]);
  const ST_LABEL = { na: 'not available', broken: 'broken · waiting for picker', replaced: 'broken · replaced' };
  const repList = reportedParts(t).filter(k => !(p.qcCall && p.qcCall.for.includes(k))).map(k => { const [sku, pt] = k.split(':'); return `<div class="small" style="padding:2px 0">• ${esc(SKU[sku].brand)} ${esc(SKU[sku].name)} (${pt === 'tester' ? 'tester' : 'sealed unit'}) — <b>${ST_LABEL[partSt(t, sku, pt)]}</b></div>`; }).join('');
  if (p.qcPick === 'alt') { p.qcCall = { outcome: 'alt', for: reportedParts(t), at: Date.now(), note: '' }; p.qcCalling = false; p.qcPick = null; p.qcRetry = false; }
  const need = callNeeded(t), c = p.qcCall, first = t.customer.name.split(' ')[0];
  let callCard = '';
  const OPTS = { ok: ['check', 'Customer OK without it'], alt: ['bag', 'Add alternatives'], noreach: ['x', "Couldn't reach customer"], esc: ['headset', 'Escalate to ops manager'] };
  const pick = p.qcPick;
  if (need) {
    let inner;
    if (!p.qcCalling) inner = `<button class="btn full mt" data-act="qcCall">${ic('phone', 's')} Call customer</button><div class="xs muted mt4">Masked number · ${esc(t.customer.phone)}</div>`;
    else if (!pick) inner = `<div class="small b mt">What did you agree?</div>
        <div class="outs mt">${Object.entries(OPTS).map(([k, [i, l]]) => `<button data-act="qcPick" data-v="${k}">${ic(i, 's')}<span>${l}</span></button>`).join('')}</div>`;
    else if (pick === 'noreach' && !p.qcRetry) inner = `<div class="row sb mt"><div class="small b">${ic(OPTS[pick][0], 's')} ${OPTS[pick][1]}</div><button class="link" data-act="qcPick" data-v="">Change</button></div>
        <div class="small mt4">Try calling ${esc(first)} once more before you leave.</div>
        <button class="btn full mt" data-act="qcRetry">${ic('phone', 's')} Call again</button>`;
    else {
      const req = pick === 'esc', ph = { ok: `e.g. ${first} doesn't need a replacement`, noreach: 'e.g. Called twice, no answer', esc: 'Tell the ops manager what happened and what you need' }[pick];
      const btn = { ok: 'Confirm', noreach: 'Go without it', esc: `${ic('headset', 's')} Escalate to ops manager` }[pick];
      inner = `<div class="row sb mt"><div class="small b">${ic(OPTS[pick][0], 's')} ${OPTS[pick][1]}</div><button class="link" data-act="qcPick" data-v="">Change</button></div>
        ${pick === 'noreach' ? `<div class="xs muted mt4">Still no answer? ${esc(first)} will get an app message saying which item isn't coming. She can talk to you at the door.</div>` : ''}
        <label class="fl">Message ${req ? '<span class="req">Required</span>' : '<span class="xs muted">(optional)</span>'}</label>
        <textarea class="field" data-in="qcNote" placeholder="${esc(ph)}">${esc(p.qcNote || '')}</textarea>
        <div class="row mt" style="gap:8px">${pick === 'noreach' ? `<button class="btn ghost sm grow" data-act="qcPick" data-v="">She answered</button>` : ''}
          <button class="btn sm grow" id="qcConfirm" data-act="qcConfirm" ${req && !(p.qcNote || '').trim() ? 'disabled' : ''}>${btn}</button></div>`;
    }
    callCard = `<div class="card callcard"><div class="ct">${ic('phone', 's')} Call ${esc(first)} before you leave</div>
      <div class="xs muted" style="margin-bottom:4px">Tell her what you reported:</div>${repList}${inner}</div>`;
  }
  else if (c) {
    const note = c.note ? `<div class="xs mt4">“${esc(c.note)}”</div>` : '';
    const nAlt = t.items.filter(i => i.extra).length;
    if (c.outcome === 'alt') callCard = nAlt
      ? `<div class="banner ok">${ic('check', 's')}<div class="grow"><b>${nAlt} alternative${nAlt > 1 ? 's' : ''} added for ${esc(first)}</b><div class="xs">Pick them from the shelf and tick them under Extras.</div>${note}<button class="link mt" data-act="altBack">‹ Back to options</button></div></div>`
      : `<div class="banner warn">${ic('bag', 's')}<div class="grow"><b>Add the alternatives ${esc(first)} agreed to</b>${note}<button class="btn sm full mt" data-act="invOpen">${ic('bag', 's')} Search inventory</button><button class="link mt" data-act="altBack">‹ Back to options</button></div></div>`;
    else callCard = `<div class="banner ${c.outcome === 'esc' ? 'warn' : 'ok'}">${ic(c.outcome === 'esc' ? 'headset' : 'check', 's')}<div><b>${{ ok: `${esc(first)} is OK without it`, noreach: `Couldn't reach ${esc(first)} · going without it`, esc: 'Escalated to the ops manager' }[c.outcome] || 'Noted'}</b>
      ${c.outcome === 'noreach' ? `<div class="xs mt4">${esc(first)} has been sent an app message about the missing item.</div>` : c.outcome === 'esc' ? '<div class="xs mt4">You can carry on with the pickup. Ops will follow up.</div>' : ''}${note}</div></div>`;
  }
  const allTicked = done === list.length;
  const blockers = cancelPending(t) ? 'Waiting for cancellation decision' : reschedPending(t) ? 'Waiting for customer to reschedule' : brokenPending(t) ? 'Talk to the picker about the broken item' : need ? 'Call the customer first' : (c && c.outcome === 'alt' && !t.items.some(i => i.extra)) ? 'Add an alternative' : !allTicked ? `Tick ${list.length - done} more item${list.length - done > 1 ? 's' : ''}` : !(p.photos || {}).pickup ? 'Take the pickup photo' : !pickupPhotoOk(t) ? 'Retake the pickup photo' : '';
  const body = `
    ${cancelBanner(t)}
    <div class="card"><div class="ct">${ic('shield', 's')} Tester requirements</div>
      <div class="small" style="display:flex;flex-direction:column;gap:6px">
        <div class="row top">${ic('check', 's')}<span>One tester per product, plus the sealed units listed</span></div>
        <div class="row top">${ic('check', 's')}<span>Testers new or at least half full, caps intact</span></div>
        <div class="row top">${ic('check', 's')}<span>Sealed units stay unopened until sold</span></div>
        <div class="row top">${ic('check', 's')}<span>Hygiene kit sealed and complete</span></div></div>
    </div>
    <div class="card"><div class="row sb"><div class="row" style="gap:8px"><div class="ct" style="margin:0">Expected products</div><span class="tag ${done === list.length ? 'ok' : ''}">${done}/${list.length}</span></div>
        </div>
      <button class="btn ${allOn ? 'ghost' : ''} full mt" data-act="checkAll" data-v="${allOn ? 'off' : 'on'}">${allOn ? 'Untick all' : `${ic('check', 's')} All received · tick all`}</button>
      <div class="xs muted" style="margin:8px 0 4px">Nothing wrong? Tap once above. Otherwise tick items one by one and tap Report on any tester or product that's not available or broken.</div>
      ${main.map(m => qcRow(t, m)).join('')}
    </div>
    ${callCard}
    ${extras.length ? `<div class="card extras"><div class="ct">${ic('sparkle', 's')} Extras · ${extras.length}</div><div class="xs muted" style="margin-bottom:4px">Alternatives you added after your call with ${esc(first)}</div>${extras.map(m => qcRow(t, m)).join('')}<button class="link mt" data-act="invOpen">+ Add more</button></div>` : ''}
    ${allTicked ? photoCard(t, 'pickup', 'Pickup photo', true) : `<div class="card dashed small muted row" style="gap:8px">${ic('camera', 's')} Tick all items, then take a photo of what you picked up.</div>`}
    ${!need && !p.qcCalling ? `<button class="link" style="align-self:center" data-act="contact" data-v="call">${ic('phone', 's')} Call ${esc(first)}</button>` : ''}
    ${p_cancelLink(t)}`;
  return { body, foot: slider('pickupDone', 'Slide to confirm pickup', !blockers, blockers) };
}

/* Screen 6 – Beauty trial */
function trial(t) {
  const p = t.p; p.trial = p.trial || {};
  /* tester missing at pickup: she can't try it, so the not-buying reason is filled in for her */
  t.items.forEach(i => { if (!fullyNA(t, i) && !hasTester(t, i) && sealedAvail(t, i)) { const e = p.trial[i.sku] = p.trial[i.sku] || {}; e.st = 'nottried'; if (!e.buy) { e.reason = TESTER_NA; e.rnote = ''; } } });
  const live = t.items.filter(i => !fullyNA(t, i)), marked = live.filter(i => (p.trial[i.sku] || {}).st).length, tt = totals(t), left = trialLeft(t);
  const cards = t.items.map(i => {
    const s = SKU[i.sku], e = p.trial[i.sku] || {}, q = qtyOf(t, i.sku);
    if (fullyNA(t, i)) return `<div class="card na"><div class="row top">${thumb(i.sku, true)}<div class="grow"><div class="b nm">${esc(s.brand)}</div><div class="small nm">${esc(s.name)}</div><div class="xs muted">${esc(s.variant)}</div>
      <div class="tags"><span class="tag bad">Not available at pickup</span></div></div></div></div>`;
    const noTester = !hasTester(t, i), noSealed = !sealedAvail(t, i);
    const reasons = (e.st === 'nottried' ? [NOT_TRIED_REASON] : []).concat(NOPURCHASE_REASONS);
    const decide = !e.st ? `<div class="xs muted mt">Mark Tried or Not tried first</div>` : noSealed ? `<div class="banner muted mt">${ic('alert', 's')}<div class="xs">The sealed unit wasn't available at pickup, so this can't be bought today.</div></div>` : `
      <div class="checkline mt" data-act="buyTick" data-sku="${i.sku}">
        <span class="chk ${e.buy ? 'on' : ''}">${e.buy ? ic('check', 's') : ''}</span>
        <div class="grow"><div class="b small">Customer is buying this</div><div class="xs muted">She ordered ${i.sealed} · ${money(s.price)} each</div></div>
      </div>
      ${e.buy && i.sealed > 1 ? `<div class="row sb mt"><span class="small">Quantity she's buying</span>
        <div class="stepper"><button data-act="qty" data-sku="${i.sku}" data-d="-1" ${q <= 1 ? 'disabled' : ''}>−</button><b>${q}</b><button data-act="qty" data-sku="${i.sku}" data-d="1" ${q >= i.sealed ? 'disabled' : ''}>+</button></div></div>` : ''}
      ${e.buy ? '' : noTester ? `<div class="autoreason mt">${ic('alert', 's')}<span>Not buying · <b>${TESTER_NA}</b></span><span class="xs muted">filled in for you</span></div>` : `<label class="fl">Why isn't she buying it? <span class="req">Required</span></label>
        ${dd('tr:' + i.sku, e.reason, [['', reasons]])}
        ${e.reason === 'Other' ? `<textarea class="field mt" data-in="trNote" data-sku="${i.sku}" id="n-${i.sku}" placeholder="Write the reason">${esc(e.rnote || '')}</textarea>` : ''}`}`;
    const ok = e.st && (noSealed || e.buy || (e.reason && (e.reason !== 'Other' || (e.rnote || '').trim())));
    return `<div class="card ${ok ? '' : 'todo'}">
      <div class="row top">${thumb(i.sku, true)}
        <div class="grow"><div class="b">${esc(s.brand)}</div><div class="small">${esc(s.name)}</div><div class="xs muted">${esc(s.variant)} · ${s.cat}</div>
          <div class="tags">${i.tester ? (noTester ? '<span class="tag bad">No tester</span>' : '<span class="tag">Tester</span>') : ''}${noSealed ? '<span class="tag bad">Sealed not available</span>' : `<span class="tag">Ordered ×${i.sealed}</span>`}${extraTag(i)}${q ? `<span class="tag ok">${ic('check', 's')} Buying ×${q}</span>` : ''}</div></div>
        <div class="b small">${money(s.price)}</div></div>

}

/* Screen 7 – Basket */

    <button class="link" style="align-self:center;color:var(--bad)" data-act="noPay">Customer didn't pay?</button>` : '';

}

/* Screen 10 – Return inventory */
function returnRows(t) {
  const rows = [];
  t.items.forEach(i => {
    const s = SKU[i.sku], left = sealedAvail(t, i) - sold(t, i.sku), x = i.extra ? ' · Extra' : '';
    for (let k = 0; k < left; k++) rows.push({ id: `${i.sku}-s${k}`, g: 'sale', sku: i.sku, name: `${s.brand} ${s.name}`, sub: `${s.variant} · Sealed${left > 1 ? ` (${k + 1} of ${left})` : ''}${x}` });
    if (hasTester(t, i)) rows.push({ id: `${i.sku}-t`, g: 'tester', sku: i.sku, name: `${s.brand} ${s.name}`, sub: `${s.variant} · Tester${x}` });
  });
  KIT.forEach(k => rows.push({ id: k.id, g: 'other', name: k.name, sub: k.qty }));
  if (handBack(t)) { const ck = t.p.checks || {}; return rows.filter(r => ck[r.sku || r.id]); }
  return rows;
}

    const naList = naParts(t).map(k => { const [sku, pt] = k.split(':'); const s = SKU[sku]; return `<div class="prow na"><div class="thumb" style="background:var(--chip)">${ic('x', 's')}</div><div class="grow"><div class="b small nm">${esc(s.brand)} ${esc(s.name)}</div><div class="xs muted">${esc(s.variant)} · ${pt === 'tester' ? 'Tester' : 'Sealed'} · Not available at pickup</div></div></div>`; }).join('');

/* Demo: things that happen on someone else's side after DEMO_SECS seconds */
function autoEvents() {
  if (!S.onboarded) return;
  const now = Date.now(); let msg = null, changed = false;
  all().forEach(t => {
    const c = t.cancelReq;
    if (c && c.status === 'pending' && now >= c.due) {
      c.status = 'approved'; c.decidedAt = now; t.completedAt = now; t.isNew = false; changed = true;
      notify('cancel', `Cancellation approved · ${t.id} (${t.customer.name})`, t.id);
      if (t.p.pickedAt) { t.status = 'return_pending'; t.p.stage = 'return'; msg = `${t.id} cancelled · return the items to the dark store`; if (S.view === 'task' && S.taskId === t.id) ui.viewStage = null; }
      else if (receivedAny(t)) { t.p.handBack = true; t.status = 'return_pending'; t.p.stage = 'return'; msg = `${t.id} cancelled · hand the items back to the dark store`; if (S.view === 'task' && S.taskId === t.id) ui.viewStage = null; }
      else { t.status = 'cancelled'; msg = `${t.id} cancellation approved`; if (S.view === 'task' && S.taskId === t.id) { S.view = 'tabs'; S.tab = 'home'; ui.viewStage = null; ui.modal = null; } }
    }
    const l = t.p.link;
    if (l && l.status === 'sent' && now >= l.due) {
      l.status = 'paid';
      t.p.pay = { status: 'paid', at: now, method: 'app', via: 'UPI · Google Pay', txn: 'WGP' + String(now).slice(-8) };
      if (t.p.stage === 'basket') t.p.stage = 'payment';
      if (ui.modal && ui.modal.type === 'noPay') ui.modal = null;
      changed = true; msg = `Payment received · ${money(totals(t).total)}`; notify('pay', `Payment received · ${money(totals(t).total)} from ${t.customer.name}`, t.id);
    }
    const r = t.p.retCheck;
    if (t.status === 'return_review' && r && r.status === 'review' && now >= r.due) {
      r.status = 'approved'; r.at = now; t.p.returnedAt = now; t.status = 'completed'; changed = true;
      msg = `${t.id} return approved by ${WH.staff}`; notify('ret', `Return approved by ${WH.staff} · ${t.id}`, t.id);
    }
  });
  all().forEach(t => {
    if (reschedPending(t) && ['accepted', 'in_progress'].includes(t.status) && now >= t.p.resched.due) {
      t.cancelReason = 'Customer rescheduled'; t.p.resched.doneAt = now; t.completedAt = now; t.isNew = false; changed = true;
      if (t.p.pickedAt) { t.status = 'return_pending'; t.p.stage = 'return'; msg = `${t.customer.name.split(' ')[0]} rescheduled · return the items`; if (S.view === 'task' && S.taskId === t.id) ui.viewStage = null; }
      else if (receivedAny(t)) { t.p.handBack = true; t.status = 'return_pending'; t.p.stage = 'return'; msg = `${t.customer.name.split(' ')[0]} rescheduled · hand the items back`; if (S.view === 'task' && S.taskId === t.id) ui.viewStage = null; }
      else { t.status = 'cancelled'; msg = `${t.customer.name.split(' ')[0]} rescheduled · ${t.id} cancelled`; if (S.view === 'task' && S.taskId === t.id) { S.view = 'tabs'; S.tab = 'home'; ui.viewStage = null; ui.modal = null; } }
    }
  });
  all().filter(needsAck).forEach(t => {
    const a = ackInfo(t);
    const T0 = ackTimes(t), sent = t.p.ackSent || 0, upto = a.state === 'remind' ? a.n : a.state === 'late' ? ACK_N : 0;
    for (let k = sent + 1; k <= upto; k++) notify('ack', `Acknowledge your ${fmtT(t.apptAt)} visit with ${t.customer.name} · reminder ${k} of ${ACK_N}`, t.id, T0.at(k));
    if (upto > sent) { t.p.ackSent = upto; if (a.state === 'remind') ui.notif = { id: t.id, n: a.n, at: now }; changed = true; }
    if (a.state === 'late' && !t.p.ackLate) { t.p.ackLate = now; ui.notif = { id: t.id, late: true, at: now }; notify('late', `Not acknowledged in time · ${t.customer.name}, ${fmtT(t.apptAt)}`, t.id, T0.due); changed = true; }
  });
  if (ui.notif && now - ui.notif.at > 8000) { ui.notif = null; changed = true; }
  const o = S.sos;
  if (o && o.phase === 'countdown' && now >= o.due) { S.sos = { phase: 'sent', at: now, st: 0 }; changed = true; }
  else if (o && o.phase === 'sent') { const st = now - o.at < 5000 ? 0 : now - o.at < 15000 ? 1 : 2; if (st !== o.st) { o.st = st; changed = true; } }
  if (changed) { if (msg) toast(msg); render(); }
}

/* ---------- Slide-to-confirm ---------- */
function bindSliders() {
  document.querySelectorAll('.slider').forEach(s => {
    if (s.classList.contains('disabled')) return;
    const knob = s.querySelector('.knob'), fill = s.querySelector('.fill');
    let x0 = 0, dx = 0, drag = false;
    const max = () => s.clientWidth - knob.offsetWidth - 10;
    knob.addEventListener('pointerdown', e => { drag = true; x0 = e.clientX; dx = 0; knob.setPointerCapture(e.pointerId); knob.style.transition = 'none'; });
    knob.addEventListener('pointermove', e => { if (!drag) return; dx = Math.max(0, Math.min(max(), (e.clientX - x0) / SCALE)); knob.style.transform = `translateX(${dx}px)`; fill.style.width = (dx + 54) + 'px'; });
    const end = () => {
      if (!drag) return; drag = false; knob.style.transition = '';
      if (dx >= max() * 0.88) { knob.style.transform = `translateX(${max()}px)`; fill.style.width = '100%'; setTimeout(() => act(s.dataset.slide, {}), 180); }
      else { knob.style.transform = ''; fill.style.width = '0'; }
    };
    knob.addEventListener('pointerup', end); knob.addEventListener('pointercancel', end);
  });
}

function act(a, d) {
  const t = T();

      const prev = path[i - 1];
      if (ui.viewStage || isLocked(t, prev)) ui.viewStage = prev;   // confirmed step: view only
      else setStage(prev);                                           // not confirmed yet: step back for real
      break;
    }

    case 'modal': ui.modal = { type: d.type, id: d.id || S.taskId, item: d.item, reason: '', note: '' }; break;

    case 'ddToggle': ui.dd = ui.dd === d.k ? null : d.k; break;

      S.view = 'task'; S.taskId = d.id; ui.viewStage = null; ui.otp = ''; ui.otpErr = false; ui.cash = ''; toast('Visit acknowledged'); break; }
    case 'calDay': ui.calDay = Number(d.v); ui.calTop = null; ui.modal = { type: 'calSheet', day: Number(d.v) }; break;

function ageOf(d){ if(!d) return null; const b=new Date(d+'T00:00:00'); if(isNaN(b)) return null; const t=new Date();
  let a=t.getFullYear()-b.getFullYear(); const m=t.getMonth()-b.getMonth(); if(m<0||(m===0&&t.getDate()<b.getDate())) a--; return a; }
const ageText=d=>{ const a=ageOf(d); return a!==null&&a>=0 ? a+' years' : ''; };
const own=()=>S.travel==='bike'||S.travel==='car';

const today=()=>new Date().toISOString().slice(0,10);

  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

/* ---------- Validity ---------- */
function valid(){
  switch(screen){
    case 'login': return /^[6-9]\d{9}$/.test(S.phone);
    case 'otp': return /^\d{4}$/.test(S.otp);
    case 'about': return S.name.trim().length>=3 && ageOf(S.dob)!==null && S.father.trim().length>=2 && S.mother.trim().length>=2;
    case 'address': return !!(S.house.trim() && S.street.trim() && /^\d{6}$/.test(S.pin) && S.city.trim() && S.state.trim() && S.emName.trim().length>=2 && S.emRel && /^[6-9]\d{9}$/.test(S.emPhone) && S.emPhone!==S.phone);
    case 'docs': return S.digi || !!(S.docs.aF && S.docs.aB && S.docs.pan);
    case 'travel': return !!S.travel && (!own() || S.digi || !!(S.docs.dlF && S.docs.dlB));
    case 'selfie': return !!S.selfie;
    case 'review': return S.consent;
    default: return true;
  }
}

function top(){
  if(screen==='login'||screen==='otp'||screen==='done')
    return `<header class="brandbar">${screen==='otp'?`<button class="iconbtn" data-go="login" aria-label="Back">${ic('back')}</button>`:''}<div class="logo">W</div><div><b>Wingit Partner</b><span>${screen==='done'?'Application':'Sign up'}</span></div></header>`;
  const i=STEPS.indexOf(screen), prev=i===0?null:STEPS[i-1];
  return `<header class="topbar">${prev?`<button class="iconbtn" data-go="${prev}" aria-label="Back">${ic('back')}</button>`:''}
    <div class="tt"><div class="title">${TITLES[screen][0]}</div><div class="sub">${TITLES[screen][1]}</div></div>
    <span class="stepno">Step ${i+1} of ${STEPS.length}</span></header>
    <div class="progress"><i style="width:${((i+1)/STEPS.length)*100}%"></i></div>`;
}
function foot(label,note){
  const lbl=fromReview&&STEPS.includes(screen)&&screen!=='review'?'Save and go to review':label;
  return `<footer class="foot"><button class="btn full" id="cta" type="button">${lbl} ${ic('arrow','s')}</button>${note?`<div class="xs muted">${note}</div>`:''}</footer>`;
}
const fld=(id,k,label,val,attrs='')=>`<label class="fl" for="${id}">${label}</label><input class="field" id="${id}" data-k="${k}" value="${esc(val)}" ${attrs}>`;

/* ---------- Render + bind ---------- */
function go(to){ screen=to; render(); }
function render(){
  clearInterval(timer);
  app.className='ob';
  app.innerHTML=statusbar()+top()+V[screen]();
  bind(); update(); persist();
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=ic('check','s')+esc(msg); app.appendChild(t); setTimeout(()=>t.remove(),2400); }

function bind(){
  $$('[data-go]',app).forEach(b=>b.onclick=()=>{ if(b.dataset.go==='login') S.otp=''; go(b.dataset.go); });
  $$('[data-edit]',app).forEach(b=>b.onclick=()=>{ fromReview=true; go(b.dataset.edit); });
  $$('input[data-k]',app).forEach(inp=>inp.addEventListener('input',()=>{
    const k=inp.dataset.k; let v=inp.value;
    if(k==='phone'||k==='pin'||k==='aadhaarNo'||k==='emPhone'){ v=v.replace(/\D/g,''); inp.value=v; }
    if(k==='emPhone'){ const e=$('#emErr'); if(e) e.textContent=v.length===10&&v===S.phone?'Use a different number from your own.':''; }
    if(k==='panNo') v=v.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(k==='dlNo') v=v.toUpperCase();
    S[k]=v;
    if(k==='dob') $('#age').value=ageText(v);
    if(k==='pin') onPin();
    update();
  }));
  $$('input[data-up]',app).forEach(inp=>inp.onchange=()=>readFile(inp,src=>{ S.docs[inp.dataset.up]=src; render(); }));
  const sf=$('#f-selfie',app); if(sf) sf.onchange=()=>readFile(sf,src=>{ S.selfie=src; render(); });
  $$('[data-tr]',app).forEach(b=>b.onclick=()=>{ S.travel=b.dataset.tr; render(); });
  $$('[data-rel]',app).forEach(b=>b.onclick=()=>{ S.emRel=b.dataset.rel; $$('[data-rel]',app).forEach(x=>x.classList.toggle('on',x===b)); update(); persist(); });
  const cons=$('#cons',app); if(cons) cons.onclick=()=>{ S.consent=!S.consent; cons.setAttribute('aria-checked',S.consent); $('.chk',cons).classList.toggle('on',S.consent); update(); };
  const dg=$('#digi',app); if(dg) dg.onclick=digiSheet;
  const ud=$('#undoDigi',app); if(ud) ud.onclick=()=>{ S.digi=false; S.aadhaarNo=''; S.panNo=''; S.dlNo=''; render(); };
  if(screen==='otp') bindOtp();
  if(screen==='login') $('#ph').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(DEMO||valid())) next(); });
  $('#cta').onclick=()=>{ if(DEMO||valid()) next(); };
}
function onPin(){
  const keep=()=>{ const p=$('#pin'); p.focus(); p.setSelectionRange(S.pin.length,S.pin.length); };
  if(S.pin.length===6){ const hit=PINS[S.pin.slice(0,3)];
    if(hit){ S.city=hit[0]; S.state=hit[1]; S.pinKnown=true; } else { S.pinKnown=false; S.city=''; S.state=''; }
    render(); keep();
  } else if(!S.pinKnown||S.city){ S.city=''; S.state=''; S.pinKnown=true; render(); keep(); }
}
function readFile(inp,cb){ const f=inp.files&&inp.files[0]; if(!f) return;
  if(f.size>8*1024*1024){ toast('That photo is over 8 MB. Try a smaller one.'); return; }
  const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(f); }
function bindOtp(){
  const o=$('#otp'); o.focus();
  o.addEventListener('input',()=>{ o.value=o.value.replace(/\D/g,'').slice(0,4); S.otp=o.value; update();
    if(S.otp.length===4) setTimeout(()=>{ if(screen==='otp'&&valid()) next(); },250); });
  let s=30; timer=setInterval(()=>{ s--; const el=$('#sec'); if(el) el.textContent=s;
    if(s<=0){ clearInterval(timer); $('#resend').innerHTML='Didn’t get it? <button class="link" id="rs">Resend OTP</button>';
      $('#rs').onclick=()=>{ S.otp=''; render(); toast('New OTP sent to '+fmtPh(S.phone)); }; } },1000);
}
function next(){
  const order=['login','otp','about','address','docs','travel','selfie','review','done'];
  if(screen==='done'){ finishOnboarding(S); return; }
  if(screen==='review'&&!S.appId) S.appId=String(Date.now()).slice(-6);
  if(fromReview&&STEPS.includes(screen)&&screen!=='review'){ fromReview=false; return go('review'); }
  if(screen==='review') fromReview=false;
  go(order[order.indexOf(screen)+1]);
}
function digiSheet(){
  const w=document.createElement('div'); w.className='overlay';
  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dgt"><div class="grab"></div>
    <h2 id="dgt">Share documents from DigiLocker</h2>
    <p class="small muted">Wingit will get a verified copy of:</p>
    <ul><li>${ic('check','s')}Aadhaar (last 4 digits only)</li><li>${ic('check','s')}PAN card</li><li>${ic('check','s')}Driving licence, if you have one</li></ul>
    <button class="btn full" id="dgOk" type="button">Allow and continue</button><button class="btn ghost full" id="dgNo" type="button">Not now</button></div>`;
  w.addEventListener('click',e=>{ if(e.target===w) w.remove(); });
  app.appendChild(w);
  $('#dgNo',w).onclick=()=>w.remove();
  $('#dgOk',w).onclick=()=>{
    $('.sheet',w).innerHTML=`<div class="grab"></div><div class="spin" role="status" aria-label="Fetching"></div><p class="small muted center">Fetching your documents…</p>`;
    setTimeout(()=>{ w.remove(); S.digi=true; S.aadhaarNo=S.aadhaarNo.length===12?S.aadhaarNo:'582047734821'; S.panNo=S.panNo||'BQKPS4821K'; S.dlNo=S.dlNo||'HR26 20190012345'; render(); toast('Documents fetched from DigiLocker'); },1300);
  };
}

function fill(){
  Object.assign(S,{phone:'9876543210',otp:'4821',name:'Priya Sharma',dob:'1996-08-14',father:'Rajesh Sharma',mother:'Sunita Sharma',
    house:'B-204, Palm Residency',street:'Sector 56, Golf Course Extension Road',landmark:'Near Sector 56 Metro',pin:'122011',city:'Gurugram',state:'Haryana',pinKnown:true,
    aadhaarNo:'',panNo:'',travel:'bike',dlNo:'',digi:false,consent:false,emName:'Sunita Sharma',emRel:'Parent',emPhone:'9811122233'});
  S.docs={aF:sample('Aadhaar · front'),aB:sample('Aadhaar · back'),pan:sample('PAN'),dlF:sample('Licence · front'),dlB:sample('Licence · back')};
  S.selfie=SAMPLE_FACE; render(); toast('Sample data filled in');
}
function persist(){ try{ localStorage.setItem(OB_KEY, JSON.stringify({S, screen, fromReview})); }catch(e){} }
try{ const saved=JSON.parse(localStorage.getItem(OB_KEY)); if(saved&&saved.S){ S=Object.assign(blank(),saved.S); screen=saved.screen||'login'; fromReview=!!saved.fromReview; } }catch(e){}
return {
  render, fill, go:(to)=>{ fromReview=false; screen=to; render(); },
  reset:()=>{ S=blank(); screen='login'; fromReview=false; try{ localStorage.removeItem(OB_KEY); }catch(e){} },
  state:()=>S, screen:()=>screen, screens:ALL
};
})();

addEventListener('resize', fit); fit();
render();
</script>
